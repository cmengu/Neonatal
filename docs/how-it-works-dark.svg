<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 230" width="1100" height="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">How NeonatalGuard combines its three tiers into one verdict</title><desc id="d">A line runs left to right through four stages. Tier 1 sets a minimum level. Tier 2 can raise it, or quiet a single-feature YELLOW. Tier 3 runs only if the level so far is not GREEN and can only raise it. A bypass under Tier 3 shows that it is skipped on GREEN.</desc><path d="M30 90H1070" stroke="#58a6ff" stroke-width="2.5" fill="none"/><path d="M1064 84L1074 90L1064 96Z" fill="#58a6ff"/><path d="M130 90h6l4 -8l4 8h6l4 -38l5 50l4 -12h8" fill="none" stroke="#58a6ff" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M360 90h6l4 -8l4 8h6l4 -38l5 50l4 -12h8" fill="none" stroke="#58a6ff" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M590 90h6l4 -8l4 8h6l4 -38l5 50l4 -12h8" fill="none" stroke="#58a6ff" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M815 90h6l4 -8l4 8h6l4 -38l5 50l4 -12h8" fill="none" stroke="#58a6ff" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M695 90V172q0 10 10 10H890q10 0 10 -10V100" stroke="#6e7681" stroke-width="2" stroke-dasharray="6 6" fill="none"/><path d="M894 104L900 94L906 104Z" fill="#6e7681"/><text x="800" y="206" font-size="14" fill="#9198a1" text-anchor="middle">Level so far is GREEN: Tier 3 never runs</text><circle cx="30" cy="90" r="5" fill="#6e7681"/><text x="30" y="46" font-size="17" font-weight="600" fill="#e6edf3">Window</text><text x="30" y="120" font-size="14" fill="#9198a1">HRV z-scores against</text><text x="30" y="139" font-size="14" fill="#9198a1">the infant's own baseline</text><circle cx="250" cy="90" r="5" fill="#6e7681"/><text x="250" y="46" font-size="17" font-weight="600" fill="#e6edf3">Tier 1  Deviation</text><text x="250" y="120" font-size="14" fill="#9198a1">Sets the floor. One feature</text><text x="250" y="139" font-size="14" fill="#9198a1">is YELLOW, two together RED</text><circle cx="480" cy="90" r="5" fill="#6e7681"/><text x="480" y="46" font-size="17" font-weight="600" fill="#e6edf3">Tier 2  CUSUM</text><text x="480" y="120" font-size="14" fill="#9198a1">Raises on slow drift.</text><text x="480" y="139" font-size="14" fill="#9198a1">May quiet a lone YELLOW,</text><text x="480" y="158" font-size="14" fill="#9198a1">never a RED.</text><circle cx="710" cy="90" r="5" fill="#6e7681"/><text x="710" y="46" font-size="17" font-weight="600" fill="#e6edf3">Tier 3  RAG</text><text x="710" y="120" font-size="14" fill="#9198a1">Retrieval and LLM.</text><text x="710" y="139" font-size="14" fill="#9198a1">May raise, never lower.</text><circle cx="930" cy="90" r="5" fill="#6e7681"/><text x="930" y="46" font-size="17" font-weight="600" fill="#e6edf3">Verdict</text><text x="930" y="120" font-size="14" fill="#9198a1">Highest of the floor</text><text x="930" y="139" font-size="14" fill="#9198a1">and every raise.</text></svg>